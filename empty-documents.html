<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 - 文档管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <main id="mainContent" style="height:calc(100vh - 44px);overflow-y:auto;padding:20px;background:#f8f9fa;">
    <!-- 空状态卡片 -->
    <div style="width:90%;max-width:320px;margin:32px auto 0 auto;background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:38px 0 32px 0;display:flex;flex-direction:column;align-items:center;">
      <div style="color:#1677ff;margin-bottom:16px;"><i class="fas fa-folder-open" style="font-size:38px;"></i></div>
      <div style="font-size:17px;font-weight:600;color:#222;margin-bottom:8px;">暂无文档</div>
      <div style="font-size:14px;color:#888;text-align:center;">当前分类下没有文档，试试切换其他分类或上传新文件。</div>
    </div>
    <!-- 底部安全距离 -->
    <div class="h-8"></div>
  </main>
  <script>
  /**
   * @file empty-documents.html
   * @description 滚动到顶部时显示加载文档动画，模拟下拉刷新交互
   */
  document.addEventListener('DOMContentLoaded', function(){
    var mainContent = document.getElementById('mainContent');
    var topLoading = document.getElementById('topLoading');
    var isLoading = false;
    // 监听触摸滑动到顶部
    var startY = 0;
    var isTouching = false;
    mainContent.addEventListener('touchstart', function(e){
      if(mainContent.scrollTop === 0){
        isTouching = true;
        startY = e.touches[0].clientY;
      }
    });
    mainContent.addEventListener('touchmove', function(e){
      if(isTouching && !isLoading){
        var moveY = e.touches[0].clientY;
        if(moveY - startY > 48 && mainContent.scrollTop === 0){
          // 触发加载
          isLoading = true;
          topLoading.style.display = 'block';
          setTimeout(function(){
            topLoading.style.display = 'none';
            isLoading = false;
          }, 1200);
        }
      }
    });
    mainContent.addEventListener('touchend', function(){
      isTouching = false;
    });
  });
  </script>
</body>
</html>
