<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 - 个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }
        .status-bar {
            height: 44px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .main-content {
            height: calc(100vh - 44px - 60px); 
            overflow-y: auto;
            padding: 20px;
        }
        .profile-header {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 32px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        .menu-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
            font-size: 16px;
        }
        .menu-content {
            flex: 1;
        }
        .menu-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 2px;
        }
        .menu-subtitle {
            font-size: 12px;
            color: #666;
        }
        .premium-banner {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(255,215,0,0.3);
        }
        
        /* 侧边栏样式 - 完全按照chat.html的样式 */
        .drawer-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 76vw;
            max-width: 320px;
            height: 100vh;
            background: #fff;
            box-shadow: 2px 0 24px rgba(0,0,0,0.10);
            border-top-right-radius: 18px;
            border-bottom-right-radius: 18px;
            transition: all 0.2s;
            overflow-y: auto;
            z-index: 3001;
            transform: translateX(-100%);
        }
        .drawer-sidebar.show {
            transform: translateX(0);
        }
        .drawer-mask {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.18);
            transition: all 0.2s;
            z-index: 3000;
            display: none;
        }
        .drawer-mask.show {
            display: block;
        }
        .drawer-header {
            height: 56px;
            display: flex;
            align-items: center;    
            justify-content: space-between;     
            padding: 0 18px;
            border-bottom: 1px solid #f5f5f5;
        }
        .drawer-title {
            font-size: 17px;
            font-weight: 600;
            color: #222;
        }
        .drawer-close-btn {
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 0;
            margin-right: 8px;
        }
        .nav-section {
            padding: 18px;
            border-bottom: 1px solid #f5f5f5;
        }
        .nav-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            border: 1px solid #f0f0f0;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
        }
        .nav-btn:hover {
            background: #f8f9fa;
        }
        .nav-btn.active:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .nav-btn-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn-text {
            font-size: 16px;
            font-weight: 500;
        }
        .history-section {
            padding: 18px;
        }
        .history-section-title {
            font-size: 15px;
            font-weight: 600;
            color: #222;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        .history-section-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }
        .history-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            border: 1px solid #f0f0f0;
        }
        .history-item:hover {
            background: #f8f9fa;
        }
        .history-item-title {
            font-size: 15px;
            color: #222;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .history-item-time {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <!-- iOS状态栏 -->
    <div class="status-bar">
        <div>9:41</div>
        <div>
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi ml-1"></i>
            <i class="fas fa-battery-three-quarters ml-1"></i>
        </div>
    </div>

    <!-- 头部 -->
    <div class="header">
        <div class="flex items-center justify-between">
            <!-- 抽屉按钮 -->
            <button id="drawerBtn" style="width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;outline:none;cursor:pointer;margin-left:-8px;">
                <span style="display:inline-block;width:22px;height:22px;">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="7" width="14" height="2" rx="1" fill="#222"/>
                        <rect x="4" y="13" width="10" height="2" rx="1" fill="#222"/>
                    </svg>
                </span>
            </button>
            <div class="relative flex-1 flex justify-center">
                <h1 class="text-lg font-semibold text-gray-800">个人中心</h1>
            </div>
            <div style="width:38px;"></div>
        </div>
    </div>

    <!-- 侧边栏遮罩 -->
    <div class="drawer-mask" id="drawerMask"></div>
    
    <!-- 侧边栏 -->
    <div class="drawer-sidebar" id="drawerSidebar">
        <div class="drawer-header">
            
            <span class="drawer-title">云笺.含章</span>
            <button class="drawer-close-btn" onclick="hideDrawer()">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="7" width="14" height="2" rx="1" fill="#222"/>
                    <rect x="4" y="13" width="10" height="2" rx="1" fill="#222"/>
                </svg>
            </button>
        </div>
        
        <!-- 导航区域 -->
        <div class="nav-section">
            <!--<div class="nav-section-title">导航</div>-->
            <div class="nav-btn" onclick="navigateTo('chat')">
                <div class="nav-btn-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <div class="nav-btn-text">问答</div>
            </div>
            <div class="nav-btn" onclick="navigateTo('documents')">
                <div class="nav-btn-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="nav-btn-text">文档</div>
            </div>
            <div class="nav-btn active" onclick="navigateTo('profile')">
                <div class="nav-btn-icon">
                    <i class="fas fa-user"></i>
                </div>
                <div class="nav-btn-text">我的</div>
            </div>
        </div>
        
        <!-- 历史对话区域 -->
        <div class="history-section">
            <div class="history-section-title">
                <svg class="history-section-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 0C3.58 0 0 3.58 0 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="#888"/>
                    <path d="M8.5 4H7v5l4.25 2.52.75-1.23L8.5 8.5V4z" fill="#888"/>
                </svg>
                历史对话
            </div>
            <div class="history-item" onclick="loadHistoryChat('如何提高工作效率?')">
                <div class="history-item-title">如何提高工作效率?</div>
                <div class="history-item-time">2024-01-15 14:30</div>
            </div>
            <div class="history-item" onclick="loadHistoryChat('Python编程入门指南')">
                <div class="history-item-title">Python编程入门指南</div>
                <div class="history-item-time">2024-01-14 16:45</div>
            </div>
            <div class="history-item" onclick="loadHistoryChat('健康饮食建议')">
                <div class="history-item-title">健康饮食建议</div>
                <div class="history-item-time">2024-01-13 10:20</div>
            </div>
            <div class="history-item" onclick="loadHistoryChat('投资理财基础知识')">
                <div class="history-item-title">投资理财基础知识</div>
                <div class="history-item-time">2024-01-12 15:10</div>
            </div>
            <div class="history-item" onclick="loadHistoryChat('学习新技能的方法')">
                <div class="history-item-title">学习新技能的方法</div>
                <div class="history-item-time">2024-01-11 09:20</div>
            </div>
        </div>
    </div>

    <!-- 主内容区域 -->
    <div class="main-content">
        <!-- 个人资料 -->
        <div class="profile-header">
            <div class="profile-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="text-xl font-semibold text-gray-800 mb-2">XXX</div>
            <div class="text-sm text-gray-500 mb-1">部门：科技创新部</div>
            <div class="text-sm text-gray-500 mb-1">处室：科创体系建设处</div>
            <div class="text-sm text-gray-500 mb-4">邮箱：xxx@chinamobile.com</div>
        </div>

        <!-- 帮助与支持 -->
        <div class="menu-section">
            <div class="menu-item" id="aboutUsBtn">
                <div class="menu-icon" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                    <i class="fas fa-info-circle"></i>
                </div>
                <div class="menu-content">
                    <div class="menu-title">关于我们</div>
                    <div class="menu-subtitle">版本信息、版权声明</div>
                </div>
                <i class="fas fa-chevron-right text-gray-400"></i>
            </div>
        </div>
        
        <!-- 退出登录按钮 -->
        <div style="width:100%;display:flex;justify-content:center;">
            <button id="logoutBtn" style="margin-top:24px;width:90%;background:#ff4d4f;color:#fff;font-size:16px;font-weight:500;border:none;border-radius:12px;padding:12px 0;box-shadow:0 2px 8px rgba(255,77,79,0.08);cursor:pointer;">退出登录</button>
        </div>
    </div>

    <!-- 弹窗遮罩和弹窗 -->
    <div id="modalMask" style="display:none;position:fixed;z-index:3000;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.18);"></div>
    <div id="aboutModal" style="display:none;position:fixed;z-index:3001;left:50%;top:50%;transform:translate(-50%,-50%);width:86vw;max-width:340px;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);padding:0 0 18px 0;text-align:center;overflow:hidden;">
        <div style="font-size:18px;font-weight:700;padding:22px 0 10px 0;">关于我们</div>
        <div style="color:#888;font-size:15px;line-height:1.7;padding:0 18px 0 18px;">云笺.含章App<br>版本号：v1.0.0<br>版权所有 © 2025 中国移动</div>
        <button onclick="hideModal()" style="margin-top:18px;width:80%;background:#1677ff;color:#fff;font-size:16px;font-weight:500;border:none;border-radius:10px;padding:10px 0;">知道了</button>
    </div>
    <div id="logoutModal" style="display:none;position:fixed;z-index:3001;left:50%;top:50%;transform:translate(-50%,-50%);width:86vw;max-width:320px;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);padding:0 0 18px 0;text-align:center;overflow:hidden;">
        <div style="font-size:18px;font-weight:700;padding:22px 0 10px 0;">确认退出登录？</div>
        <div style="color:#888;font-size:15px;line-height:1.7;padding:0 18px 0 18px;">退出后将返回登录页面</div>
        <div style="display:flex;gap:14px;justify-content:center;margin-top:18px;padding:0 18px;">
            <button onclick="hideModal()" style="flex:1;height:42px;background:#f5f5f5;color:#222;font-size:16px;font-weight:500;border:none;border-radius:10px;">取消</button>
            <button id="logoutConfirmBtn" style="flex:1;height:42px;background:#ff4d4f;color:#fff;font-size:16px;font-weight:500;border:none;border-radius:10px;">退出</button>
        </div>
    </div>

    <script>
    /**
     * @file profile.html
     * @description 个人中心页面，包含抽屉菜单、导航和历史对话功能
     */
    
    // 侧边栏交互
    const drawerBtn = document.getElementById('drawerBtn');
    const drawerMask = document.getElementById('drawerMask');
    const drawerSidebar = document.getElementById('drawerSidebar');
    
    drawerBtn.addEventListener('click', function() {
        drawerMask.classList.add('show');
        drawerSidebar.classList.add('show');
    });
    
    function hideDrawer() {
        drawerMask.classList.remove('show');
        drawerSidebar.classList.remove('show');
    }
    
    drawerMask.addEventListener('click', hideDrawer);

    // 导航功能
    function navigateTo(page) {
        hideDrawer();
        if (page === 'profile') {
            // 当前页面，无需跳转
            return;
        } else if (page === 'chat') {
            window.location.href = 'chat.html';
        } else if (page === 'documents') {
            window.location.href = 'documents.html';
        }
    }

    // 历史对话加载功能
    function loadHistoryChat(title) {
        hideDrawer();
        setTimeout(() => {
            window.location.href = `chat.html?title=${encodeURIComponent(title)}`;
        }, 300);
    }
    
    // 原有的弹窗功能
    document.addEventListener('DOMContentLoaded', function(){
        var aboutBtn = document.getElementById('aboutUsBtn');
        var logoutBtn = document.getElementById('logoutBtn');
        var modalMask = document.getElementById('modalMask');
        var aboutModal = document.getElementById('aboutModal');
        var logoutModal = document.getElementById('logoutModal');
        
        // 显示/隐藏弹窗
        window.hideModal = function(){
            modalMask.style.display = 'none';
            aboutModal.style.display = 'none';
            logoutModal.style.display = 'none';
        }
        
        if(aboutBtn){
            aboutBtn.onclick = function(){
                modalMask.style.display = 'block';
                aboutModal.style.display = 'block';
            }
        }
        
        if(logoutBtn){
            logoutBtn.onclick = function(){
                modalMask.style.display = 'block';
                logoutModal.style.display = 'block';
            }
        }
        
        // 退出登录确认
        var logoutConfirmBtn = document.getElementById('logoutConfirmBtn');
        if(logoutConfirmBtn){
            logoutConfirmBtn.onclick = function(){
                hideModal();
                // 模拟跳转登录页
                setTimeout(function(){
                    window.location.href = 'login.html';
                }, 300);
            }
        }
        
        // 点击遮罩关闭弹窗
        if(modalMask){
            modalMask.onclick = hideModal;
        }
    });
    </script>
</body>
</html>
